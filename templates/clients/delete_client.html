{% extends "base.html" %}

{% block title %}Excluir cliente - {{ block.super }}{% endblock %}

{% block body %}
<div class="section">
    <h1>Excluir cliente</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% else %}
        <p>Deseja excluir o cliente <strong>{{ client.name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button class="button" type="submit">Confirmar exclusão</button>
        </form>
    {% endif %}

    <a class="text-link" href="{% url 'clients:list_clients' %}">Voltar</a>
</div>
{% endblock %}
