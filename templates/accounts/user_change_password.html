{% extends "base.html" %}

{% block title %}
Alterar Senha - {{ block.super}}
{% endblock title %}

{% block body %}

<div class="section">
    <h1>Alterar Senha</h1>
    <form action="" method="POST">
        {% csrf_token %}
        <label>Senha Anterior</label>
        {{ form.old_password }}
        <label>Nova Senha</label>
        {{ form.new_password1 }}
        <label>Confirmar Nova Senha</label>
        {{ form.new_password2 }}
        <button type="submit" >Atualizar</button>
    </form>
</div>

{% endblock body %}
