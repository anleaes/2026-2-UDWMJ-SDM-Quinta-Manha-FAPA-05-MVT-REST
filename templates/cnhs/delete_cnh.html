{% extends "base.html" %}

{% block title %}Excluir CNH - {{ block.super }}{% endblock %}

{% block body %}
<div class="section">
    <h1>Excluir CNH</h1>

    <p>
        Excluir a CNH <strong>{{ cnh.number }}</strong>
        de <strong>{{ cnh.client.name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button class="button" type="submit">Confirmar exclusão</button>
    </form>

    <a class="text-link" href="{% url 'cnhs:list_cnhs' %}">Voltar</a>
</div>
{% endblock %}
