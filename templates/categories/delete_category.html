{% extends "base.html" %}

{% block title %}Excluir Categoria - {{ block.super }}{% endblock %}

{% block body %}
<div class="section">
    <h1>Excluir Categoria</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% else %}
        <p>Deseja excluir a categoria <strong>{{ category.name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button class="button" type="submit">Confirmar exclusão</button>
        </form>
    {% endif %}

    <a class="text-link" href="{% url 'categories:list_categories' %}">Voltar</a>
</div>
{% endblock %}
